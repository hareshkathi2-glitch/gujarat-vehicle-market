
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Project
        run: |
          mkdir -p app_source

          unzip -q Gujarat_Vehicle_Market_Chat_Ready.zip -d app_source

          PUBSPEC=$(find app_source -name pubspec.yaml -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project found: $PROJECT_DIR"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Check Android Files
        run: |
          cd "$PROJECT_DIR"

          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            echo "ERROR: Android Gradle files missing."
            echo "Android project setup is required."
            exit 1
          fi

          echo "Android files found."

      - name: Check Firebase Configuration
        run: |
          cd "$PROJECT_DIR"

          if [ ! -f android/app/google-services.json ]; then
            echo "ERROR: google-services.json missing"
            exit 1
          fi

          echo "Firebase configuration found."

      - name: Install Dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter pub ge
          
