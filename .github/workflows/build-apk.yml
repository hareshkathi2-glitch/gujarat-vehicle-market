name: Build Gujarat Vehicle Market APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract Project
        run: |
          mkdir -p app_source
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP file not found"
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d app_source

      - name: Find Flutter Project
        run: |
          PUBSPEC=$(find app_source -name pubspec.yaml | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "pubspec.yaml not found"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$PUBSPEC")" >> $GITHUB_ENV

      - name: Generate Android Project
        run: |
          cd "$PROJECT_DIR"
          flutter create --platforms=android --org com.gujaratvehiclemarket .

      - name: Setup Firebase Config
        run: |
          CONFIG=$(find . -maxdepth 3 -name 'google-services*.json' | head -n 1)

          if [ -n "$CONFIG" ]; then
            mkdir -p "$PROJECT_DIR/android/app"
            cp "$CONFIG" "$PROJECT_DIR/android/app/google-services.json"
          fi
      - name: Disable Release Lint Tasks
        run: |
          cat >> "$PROJECT_DIR/android/build.gradle" <<'EOF'

          subprojects {
              tasks.configureEach {
                  if (name.startsWith("lintVital")) {
                      enabled = false
                  }
              }
          }
          EOF
      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gujarat-Vehicle-Market-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
