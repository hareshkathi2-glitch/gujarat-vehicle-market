name: Build Gujarat Vehicle Market APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract Project ZIP
        run: |
          mkdir -p app_source
          ZIP=$(find . -name "Gujarat_Vehicle_Market_Chat_Ready.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "Project ZIP not found"
            exit 1
          fi

          unzip -q "$ZIP" -d app_source

          PROJECT_DIR=$(find app_source -name pubspec.yaml -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "pubspec.yaml not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Setup Android Project
        run: |
          cd "$PROJECT_DIR"
          flutter create . --platforms=android

      - name: Setup Firebase
        run: |
          CONFIG=$(find . -name google-services.json | head -n 1)

          if [ -z "$CONFIG" ]; then
            echo "Firebase google-services.json missing"
            exit 1
          fi

          mkdir -p "$PROJECT_DIR/android/app"
          cp "$CONFIG" "$PROJECT_DIR/android/app/google-services.json"

            - name: Configure Google Services
        run: |
          python3 - <<'PY'
          import os
          import re

          p = os.environ["PROJECT_DIR"] + "/android/app"

          for f in ["build.gradle", "build.gradle.kts"]:
              path = os.path.join(p, f)

              if os.path.exists(path):
                  s = open(path).read()

                  if "com.google.gms.google-services" not in s:
                      if f.endswith(".kts"):
                          plugin = '    id("com.google.gms.google-services") version "4.4.2"\n'
                      else:
                          plugin = '    id "com.google.gms.google-services" version "4.4.2"\n'

                      s = re.sub(r'(plugins\s*\{\s*\n)', r'\1' + plugin, s, count=1)
                      open(path, "w").write(s)

                  break
          PY

      - name: Get Dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter pub get
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gujarat-Vehicle-Market-APK
          path: app_source/**/build/app/outputs/flutter-apk/app-release.apk
