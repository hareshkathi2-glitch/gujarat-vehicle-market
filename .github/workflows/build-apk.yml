name: Build Gujarat Vehicle Market APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android Project
        run: |
          flutter create --platforms=android --org com.gujaratvehiclemarket .

      - name: Prepare Main Dart
        run: |
          mkdir -p lib
          cp main.dart lib/main.dart

      - name: Setup Firebase
        run: |
          cp google-services.json android/app/google-services.json

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gujarat-Vehicle-Market-APK
          path: build/app/outputs/flutter-apk/app-release.apk
