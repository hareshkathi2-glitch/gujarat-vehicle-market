name: Build Gujarat Vehicle Market APK

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Setup Flutter
    uses: subosito/flutter-action@v2
    with:
      channel: stable

  - name: Extract Project ZIP
    run: |
      mkdir -p app_source
      ZIP=$(find . -type f -iname "Gujarat_Vehicle_Market_Chat_Ready*.zip" | head -n 1)

      if [ -z "$ZIP" ]; then
        echo "Project ZIP not found"
        exit 1
      fi

      unzip -q "$ZIP" -d app_source
      PUBSPEC=$(find app_source -name pubspec.yaml -print -quit)

      if [ -z "$PUBSPEC" ]; then
        echo "Flutter project not found"
        exit 1
      fi

      echo "PROJECT_DIR=$(dirname "$PUBSPEC")" >> "$GITHUB_ENV"

  - name: Create Android Project
    run: |
      cd "$PROJECT_DIR"
      flutter create . --platforms=android

  - name: Setup Firebase
    run: |
      CONFIG=$(find . -type f -name google-services.json | head -n 1)

      if [ -z "$CONFIG" ]; then
        echo "Firebase configuration missing"
        exit 1
      fi

      mkdir -p "$PROJECT_DIR/android/app"
      cp "$CONFIG" "$PROJECT_DIR/android/app/google-services.json"

  - name: Get Dependencies
    run: |
      cd "$PROJECT_DIR"
      flutter pub get

  - name: Build APK
    run: |
      cd "$PROJECT_DIR"
      flutter build apk --release

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Gujarat-Vehicle-Market-APK
      path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
