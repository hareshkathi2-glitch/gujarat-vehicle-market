name: Test APK Build

on:
workflow_dispatch:

jobs:
test:
runs-on: ubuntu-latest
steps:
- name: Test
run: echo "GitHub YAML Working"

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Setup Flutter
    uses: subosito/flutter-action@v2
    with:
      channel: stable

  - name: Extract Project
    run: |
      mkdir -p app_source
      unzip -q Gujarat_Vehicle_Market_Chat_Ready.zip -d app_source

      PUBSPEC=$(find app_source -name pubspec.yaml -print -quit)

      if [ -z "$PUBSPEC" ]; then
        echo "ERROR: pubspec.yaml not found"
        exit 1
      fi

      PROJECT_DIR=$(dirname "$PUBSPEC")
      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

  - name: Setup Android
    run: |
      cd "$PROJECT_DIR"
      flutter create --platforms=android --org com.gujaratvehiclemarket .

  - name: Copy Firebase
    run: |
      cp "google-services (2).json" "$PROJECT_DIR/android/app/google-services.json"

  - name: Install Dependencies
    run: |
      cd "$PROJECT_DIR"
      flutter pub get

  - name: Build APK
    run: |
      cd "$PROJECT_DIR"
      flutter build apk --release

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Gujarat-Vehicle-Market-APK
      path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
      if-no-files-found: error
      retention-days: 7
